[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
	# Use mold linker
	"-C",
	"link-arg=-fuse-ld=/usr/bin/env mold",
	# (Nightly) Make the current crate share its generic instantiations
	"-Zshare-generics=y",
]

[unstable]
codegen-backend = true

[profile.dev]
codegen-backend = "cranelift"

[profile.dev.package."*"]
codegen-backend = "llvm"
